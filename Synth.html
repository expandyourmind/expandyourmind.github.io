<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Synth - Dark Theme</title>
    <style>
        /* --- Basic Reset & Font --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Very dark background for contrast */
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-size: 14px;
        }

        h1, p { text-align: center; margin-bottom: 15px; }
        h1 { color: #ffffff; }
        p { color: #aaaaaa; font-size: 0.9em;}

        /* --- Main Synth Container & Theme --- */
        .synth-container {
            width: 100%;
            max-width: 1000px; /* Adjusted max-width */
            background-color: #1e1e1e; /* Dark base for the synth panel */
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            overflow: hidden; /* Contain children */
        }
        .dark-theme label { display: block; margin: 8px 0 3px; font-weight: bold; font-size: 0.9em; color: #bbbbbb; }
        .dark-theme .control-group span { font-weight: normal; color: #aaaaaa; font-size: 0.85em; }
        .dark-theme h3, .dark-theme h4 { color: #ffffff; display: flex; justify-content: space-between; align-items: center;}
        .dark-theme h3 { font-size: 1.1em; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 1px solid #444;}
        .dark-theme h4 { margin-top: 5px; margin-bottom: 15px; text-align: center; font-size: 1.0em; color: #ccc; border-bottom: 1px solid #444; padding-bottom: 5px; }

        /* --- Layout Sections --- */
        .top-bar {
            background-color: #2a2a2a;
            padding: 10px 20px;
            border-bottom: 1px solid #444;
            min-height: 45px; /* Placeholder height */
            display: flex;
            align-items: center;
            color: #ccc;
            font-size: 0.9em;
        }
        .main-panel {
            display: flex;
            flex-wrap: wrap; /* Allow wrapping if needed */
            gap: 20px; /* Space between main modules */
            padding: 20px;
            border-bottom: 1px solid #444;
        }
        .module-row {
            display: flex;
            flex-wrap: wrap; /* Allow modules to wrap */
            gap: 20px; /* Space between modules */
            padding: 20px;
        }

        /* --- Module Styling --- */
        .oscillator, .envelope-controls, .filter-controls, .filter-env-controls, .lfo-controls, .effects-module, .master-controls {
            background-color: #2c2c2c; /* Slightly lighter than main bg */
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            flex-grow: 1; /* Allow modules to grow */
            flex-basis: 250px; /* Minimum base width before wrapping */
            margin-bottom: 0; /* Remove default margin, rely on gap */
        }
        /* Specific widths if needed (e.g., make main panel items wider) */
         .main-panel > .oscillator,
         .main-panel > .filter-controls {
             flex-basis: 300px; /* Make main panel items a bit wider */
         }


        /* --- Control Styling --- */
        .dark-theme select, .dark-theme input[type="text"] {
            background-color: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 8px 10px;
            width: 100%;
            margin-top: 3px;
            cursor: pointer;
        }
        .dark-theme button {
             padding: 8px 15px; cursor: pointer; border: 1px solid #555; border-radius: 4px; background-color: #444; color: #e0e0e0;
        }
        .dark-theme button:hover { background-color: #555; }
        .dark-theme button:disabled { opacity: 0.5; cursor: not-allowed; }
        .dark-theme #delete-preset-button { background-color: #7f1d1d; border-color: #991b1b; color: #fecaca;} /* Muted red */
        .dark-theme #delete-preset-button:hover { background-color: #991b1b; }

        .dark-theme input[type="checkbox"] { margin-left: 10px; cursor: pointer; transform: scale(1.1); accent-color: #00bcd4; /* Cyan accent */}
        .dark-theme .lfo-destinations input[type="checkbox"] { accent-color: #00bcd4; }

        /* Basic Slider Styling (cross-browser requires prefixes) */
        .dark-theme input[type=range] {
            width: 100%;
            margin: 7px 0; /* Add some margin */
            background-color: transparent;
            -webkit-appearance: none;
             appearance: none;
             cursor: pointer;
        }
        .dark-theme input[type=range]:focus { outline: none; }

        /* Track */
        .dark-theme input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #555; border-radius: 3px; border: 1px solid #333; }
        .dark-theme input[type=range]::-moz-range-track { width: 100%; height: 6px; background: #555; border-radius: 3px; border: 1px solid #333; }

        /* Thumb */
        .dark-theme input[type=range]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: #00bcd4; border: 1px solid #007a8a; -webkit-appearance: none; margin-top: -6px; /* Adjust vertical centering */ }
        .dark-theme input[type=range]::-moz-range-thumb { height: 16px; width: 16px; border-radius: 50%; background: #00bcd4; border: 1px solid #007a8a; }

        /* Disabled Controls Styling */
        .disabled .control-group input[type=range], .disabled .control-group select, .disabled .lfo-destinations label { opacity: 0.4; pointer-events: none; }
        .effect-group.disabled .control-group input[type=range], .effect-group.disabled .control-group select { opacity: 0.4; pointer-events: none; }


        /* Keyboard Styles (unchanged) */
        .keyboard-container { width: 100%; max-width: 1000px; /* Match synth width */ overflow-x: auto; margin-top: 20px; }
        .keyboard { display: flex; justify-content: flex-start; width: fit-content; padding: 10px; background: #333; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .key { border: 1px solid #000; border-radius: 0 0 5px 5px; cursor: pointer; position: relative; user-select: none; -webkit-user-select: none; text-align: center; padding-top: 150px; font-size: 10px; color: #666; flex-shrink: 0; }
        .key.white { width: 40px; height: 180px; background: linear-gradient(to bottom, #fff 95%, #eee 100%); box-shadow: inset 0 -2px 3px rgba(0,0,0,0.2); margin-left: -1px;} .key.black { width: 28px; height: 120px; background: linear-gradient(to bottom, #222 95%, #000 100%); z-index: 1; margin: 0 -15px; box-shadow: inset 0 -2px 3px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5); color: #aaa; padding-top: 90px;}
        .key:hover { background-color: #eee; } .key.black:hover { background-color: #444; }
        .key.active, .key:active { background: linear-gradient(to bottom, #88ddff 95%, #66ccdd 100%); border-color: #00bcd4;} /* Accent color active */
        .key.black.active, .key.black:active { background: linear-gradient(to bottom, #005662 95%, #003c44 100%); border-color: #00bcd4;}/* Accent color active */
        .key span { display: block; margin-top: -145px; font-weight: bold;} .key.black span { margin-top: -85px; }
    </style>
</head>

        osc2EnableCheckbox.addEventListener('change', (e) => { updateOsc2Enabled(e.target.checked); }); osc2WaveformSelect.addEventListener('change', (e) => updateOscParams(2, 'wave', e.target.value)); osc2CoarseSlider.addEventListener('input', (e) => { const v = parseInt(e.target.value); osc2CoarseValueSpan.textContent = v; updateOscParams(2, 'coarse', v); }); osc2FineSlider.addEventListener('input', (e) => { const v = parseInt(e.target.value); osc2FineValueSpan.textContent = v; updateOscParams(2, 'fine', v); }); osc2LevelSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); osc2LevelValueSpan.textContent = v.toFixed(2); updateOscParams(2, 'level', v); }); osc2PanSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); osc2PanValueSpan.textContent = v.toFixed(2); updateOscParams(2, 'pan', v); });
        envAttackSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); envAttackValueSpan.textContent = v.toFixed(3); updateAmpEnvParams('attack', v); }); envDecaySlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); envDecayValueSpan.textContent = v.toFixed(3); updateAmpEnvParams('decay', v); }); envSustainSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); envSustainValueSpan.textContent = v.toFixed(2); updateAmpEnvParams('sustain', v); }); envReleaseSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); envReleaseValueSpan.textContent = v.toFixed(3); updateAmpEnvParams('release', v); });
        filterEnableCheckbox.addEventListener('change', (e) => { updateFilterEnabled(e.target.checked); }); filterTypeSelect.addEventListener('change', (e) => updateFilterParams('type', e.target.value)); filterCutoffSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newCutoff = mapLogarithmic(sliderValue, MIN_FILTER_FREQ, MAX_FILTER_FREQ); filterCutoffValueSpan.textContent = Math.round(newCutoff); updateFilterParams('cutoff', newCutoff); }); filterResonanceSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newQ = mapLinear(sliderValue, MIN_FILTER_Q, MAX_FILTER_Q); filterResonanceValueSpan.textContent = newQ.toFixed(2); updateFilterParams('resonance', newQ); });
        filterEnvAttackSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); filterEnvAttackValueSpan.textContent = v.toFixed(3); updateFilterEnvParams('attack', v); }); filterEnvDecaySlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); filterEnvDecayValueSpan.textContent = v.toFixed(3); updateFilterEnvParams('decay', v); }); filterEnvSustainSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); filterEnvSustainValueSpan.textContent = v.toFixed(2); updateFilterEnvParams('sustain', v); }); filterEnvReleaseSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); filterEnvReleaseValueSpan.textContent = v.toFixed(3); updateFilterEnvParams('release', v); }); filterEnvAmountSlider.addEventListener('input', (e) => { const v = parseInt(e.target.value); filterEnvAmountValueSpan.textContent = v; updateFilterEnvParams('amount', v); });
        lfo1EnableCheckbox.addEventListener('change', (e) => { updateLfoEnabled(e.target.checked); }); lfo1WaveformSelect.addEventListener('change', (e) => updateLfoParams('wave', e.target.value)); lfo1RateSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newRate = mapLogarithmic(sliderValue, MIN_LFO_RATE, MAX_LFO_RATE); lfo1RateValueSpan.textContent = newRate.toFixed(1); updateLfoParams('rate', newRate); }); lfo1DepthSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); lfo1DepthValueSpan.textContent = v.toFixed(0); updateLfoParams('depth', v); }); lfoDestCheckboxes.forEach(checkbox => { checkbox.addEventListener('change', (e) => { const dest = e.target.dataset.dest; lfo1Params.destinations[dest] = e.target.checked; updateLfoRouting(); }); });
        masterGainSlider.addEventListener('input', (e) => { const v = parseFloat(e.target.value); masterGainValueSpan.textContent = v.toFixed(2); updateMasterVolume(v); });
        delayEnableCheckbox.addEventListener('change', (e) => { updateDelayEnabled(e.target.checked); }); delayTimeSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newTime = mapLinear(sliderValue, 0, MAX_DELAY_TIME); delayTimeValueSpan.textContent = newTime.toFixed(2); updateDelayTime(newTime); }); delayFeedbackSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newFeedback = mapLinear(sliderValue, 0, MAX_FEEDBACK); delayFeedbackValueSpan.textContent = newFeedback.toFixed(2); updateDelayFeedback(newFeedback); }); delayMixSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newMix = sliderValue / 100; delayMixValueSpan.textContent = newMix.toFixed(2); updateDelayMix(newMix); });
        chorusEnableCheckbox.addEventListener('change', (e) => { updateChorusEnabled(e.target.checked); }); chorusRateSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newRate = mapLinear(sliderValue, 0.1, MAX_CHORUS_LFO_RATE); chorusRateValueSpan.textContent = newRate.toFixed(1); updateChorusRate(newRate); }); chorusDepthSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newDepth = mapLinear(sliderValue, 0, MAX_CHORUS_MOD_DEPTH); chorusDepthValueSpan.textContent = (newDepth * 1000).toFixed(1); updateChorusDepth(newDepth); }); chorusMixSlider.addEventListener('input', (e) => { const sliderValue = parseFloat(e.target.value); const newMix = sliderValue / 100; chorusMixValueSpan.textContent = newMix.toFixed(2); updateChorusMix(newMix); });

        // Keyboard/Mouse/Touch Listeners
        keyboard.addEventListener('mousedown', (e) => { if (e.target.classList.contains('key')) { const note = parseInt(e.target.dataset.note); if (!isNaN(note)) polyPlayNote(note); } }); keyboard.addEventListener('mouseup', (e) => { if (e.target.classList.contains('key')) { const note = parseInt(e.target.dataset.note); if (!isNaN(note)) polyStopNote(note); } }); keyboard.addEventListener('mouseleave', (e) => { if (e.buttons === 1 && e.target.classList.contains('key')) { const note = parseInt(e.target.dataset.note); if (!isNaN(note)) polyStopNote(note); } }); keyboard.addEventListener('touchstart', (e) => { e.preventDefault(); for (let i = 0; i < e.changedTouches.length; i++) { const touch = e.changedTouches[i]; const targetElement = document.elementFromPoint(touch.clientX, touch.clientY); if (targetElement && targetElement.classList.contains('key')) { const note = parseInt(targetElement.dataset.note); if (!isNaN(note)) { activeTouches.set(touch.identifier, targetElement); polyPlayNote(note); } } } }, { passive: false }); keyboard.addEventListener('touchend', (e) => { e.preventDefault(); for (let i = 0; i < e.changedTouches.length; i++) { const touch = e.changedTouches[i]; const targetElement = activeTouches.get(touch.identifier); if (targetElement && targetElement.classList.contains('key')) { const note = parseInt(targetElement.dataset.note); if (!isNaN(note)) polyStopNote(note); } activeTouches.delete(touch.identifier); } }); window.addEventListener('keydown', (event) => { if (event.metaKey || event.ctrlKey || event.altKey || event.repeat) return; const key = event.key.toLowerCase(); if (keyToNoteMap.hasOwnProperty(key) && !pressedComputerKeys.has(key)) { event.preventDefault(); const note = keyToNoteMap[key]; polyPlayNote(note); pressedComputerKeys.add(key); } }); window.addEventListener('keyup', (event) => { const key = event.key.toLowerCase(); if (keyToNoteMap.hasOwnProperty(key)) { event.preventDefault(); const note = keyToNoteMap[key]; polyStopNote(note); pressedComputerKeys.delete(key); } });

        // --- Initial Display Update ---
        function updateAllDisplays() {
             osc1WaveformSelect.value = osc1Params.wave; osc1CoarseSlider.value = osc1Params.coarse; osc1CoarseValueSpan.textContent = osc1Params.coarse; osc1FineSlider.value = osc1Params.fine; osc1FineValueSpan.textContent = osc1Params.fine; osc1LevelSlider.value = osc1Params.level; osc1LevelValueSpan.textContent = osc1Params.level.toFixed(2); osc1PanSlider.value = osc1Params.pan; osc1PanValueSpan.textContent = osc1Params.pan.toFixed(2);
             osc2EnableCheckbox.checked = osc2Params.enabled; osc2ControlsContainer.classList.toggle('disabled', !osc2Params.enabled); osc2WaveformSelect.value = osc2Params.wave; osc2CoarseSlider.value = osc2Params.coarse; osc2CoarseValueSpan.textContent = osc2Params.coarse; osc2FineSlider.value = osc2Params.fine; osc2FineValueSpan.textContent = osc2Params.fine; osc2LevelSlider.value = osc2Params.level; osc2LevelValueSpan.textContent = osc2Params.level.toFixed(2); osc2PanSlider.value = osc2Params.pan; osc2PanValueSpan.textContent = osc2Params.pan.toFixed(2);
             envAttackSlider.value = ampEnvParams.attack; envAttackValueSpan.textContent = ampEnvParams.attack.toFixed(3); envDecaySlider.value = ampEnvParams.decay; envDecayValueSpan.textContent = ampEnvParams.decay.toFixed(3); envSustainSlider.value = ampEnvParams.sustain; envSustainValueSpan.textContent = ampEnvParams.sustain.toFixed(2); envReleaseSlider.value = ampEnvParams.release; envReleaseValueSpan.textContent = ampEnvParams.release.toFixed(3);
             filterEnableCheckbox.checked = filterParams.enabled; filterControlsContainer.classList.toggle('disabled', !filterParams.enabled); filterEnvControlsContainer.classList.toggle('disabled', !filterParams.enabled); filterTypeSelect.value = filterParams.type; const initialCutoffSliderVal = inverseMapLogarithmic(filterParams.cutoff, MIN_FILTER_FREQ, MAX_FILTER_FREQ); filterCutoffSlider.value = initialCutoffSliderVal; filterCutoffValueSpan.textContent = Math.round(filterParams.cutoff); const initialResoSliderVal = inverseMapLinear(filterParams.resonance, MIN_FILTER_Q, MAX_FILTER_Q); filterResonanceSlider.value = initialResoSliderVal; filterResonanceValueSpan.textContent = filterParams.resonance.toFixed(2); filterEnvAttackSlider.value = filterEnvParams.attack; filterEnvAttackValueSpan.textContent = filterEnvParams.attack.toFixed(3); filterEnvDecaySlider.value = filterEnvParams.decay; filterEnvDecayValueSpan.textContent = filterEnvParams.decay.toFixed(3); filterEnvSustainSlider.value = filterEnvParams.sustain; filterEnvSustainValueSpan.textContent = filterEnvParams.sustain.toFixed(2); filterEnvReleaseSlider.value = filterEnvParams.release; filterEnvReleaseValueSpan.textContent = filterEnvParams.release.toFixed(3); filterEnvAmountSlider.value = filterEnvParams.amount; filterEnvAmountValueSpan.textContent = filterEnvParams.amount;
             lfo1EnableCheckbox.checked = lfo1Params.enabled; lfoControlsContainer.classList.toggle('disabled', !lfo1Params.enabled); lfo1WaveformSelect.value = lfo1Params.wave; const initialRateSliderVal = inverseMapLogarithmic(lfo1Params.rate, MIN_LFO_RATE, MAX_LFO_RATE); lfo1RateSlider.value = initialRateSliderVal; lfo1RateValueSpan.textContent = lfo1Params.rate.toFixed(1); lfo1DepthSlider.value = lfo1Params.depth; lfo1DepthValueSpan.textContent = lfo1Params.depth.toFixed(0); lfoDestCheckboxes.forEach(checkbox => { const dest = checkbox.dataset.dest; checkbox.checked = lfo1Params.destinations[dest]; });
             masterGainSlider.value = masterVolume; masterGainValueSpan.textContent = masterVolume.toFixed(2);
             delayEnableCheckbox.checked = delayParams.enabled; delayControlsContainer.classList.toggle('disabled', !delayParams.enabled); const initialDelayTimeSliderVal = inverseMapLinear(delayParams.time, 0, MAX_DELAY_TIME); delayTimeSlider.value = initialDelayTimeSliderVal; delayTimeValueSpan.textContent = delayParams.time.toFixed(2); const initialFeedbackSliderVal = inverseMapLinear(delayParams.feedback, 0, MAX_FEEDBACK); delayFeedbackSlider.value = initialFeedbackSliderVal; delayFeedbackValueSpan.textContent = delayParams.feedback.toFixed(2); delayMixSlider.value = delayParams.mix * 100; delayMixValueSpan.textContent = delayParams.mix.toFixed(2);
             chorusEnableCheckbox.checked = chorusParams.enabled; chorusControlsContainer.classList.toggle('disabled', !chorusParams.enabled); const initialChorusRateSliderVal = inverseMapLinear(chorusParams.rate, 0.1, MAX_CHORUS_LFO_RATE); chorusRateSlider.value = initialChorusRateSliderVal; chorusRateValueSpan.textContent = chorusParams.rate.toFixed(1); const initialChorusDepthSliderVal = inverseMapLinear(chorusParams.depth, 0, MAX_CHORUS_MOD_DEPTH); chorusDepthSlider.value = initialChorusDepthSliderVal; chorusDepthValueSpan.textContent = (chorusParams.depth * 1000).toFixed(1); chorusMixSlider.value = chorusParams.mix * 100; chorusMixValueSpan.textContent = chorusParams.mix.toFixed(2);
        }
        // Run initial display update on script load
        updateAllDisplays();
